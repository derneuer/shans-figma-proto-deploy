<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0c0f0e"><title>Шанс</title></head><body style="margin:0;background:#060807;color:#e8ece9;font-family:system-ui"><p id="l" style="padding:24px;opacity:.7">Загрузка…</p><script>
(async()=>{
try{
const n=16;
const parts=await Promise.all([...Array(n).keys()].map(i=>fetch('p'+i+'.b64').then(r=>{if(!r.ok)throw new Error(r.status+' p'+i);return r.text()})));
const bin=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));
const t=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
document.open();document.write(t);document.close();
}catch(e){document.getElementById('l').textContent='Ошибка загрузки: '+e}
})();
</script></body></html>
