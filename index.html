<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHANS</title></head><body><script>
(async()=>{
const b=await fetch('bundle.b64').then(r=>r.text());
const bin=Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const t=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
document.open();document.write(t);document.close();
})().catch(e=>{document.body.textContent='Load error: '+e});
</script></body></html>
